# PROPOSED ONLY: additions inside existing mcpgooads.batteryswap.cc TLS server{}.
# Preserve every existing location and root OAuth metadata route.
location = /mongodb/mcp {
    limit_req zone=batteryswap_mongo_read burst=4 nodelay;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8018;
    proxy_http_version 1.1;
    proxy_set_header Host mcpgooads.batteryswap.cc;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 30s;
}
location ^~ /mongodb/auth/ {
    limit_req zone=batteryswap_mongo_read burst=12 nodelay;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8018;
    proxy_http_version 1.1;
    proxy_set_header Host mcpgooads.batteryswap.cc;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
location = /.well-known/oauth-authorization-server/mongodb/auth {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8018;
    proxy_set_header Host mcpgooads.batteryswap.cc;
}
location = /.well-known/oauth-protected-resource/mongodb/mcp {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8018;
    proxy_set_header Host mcpgooads.batteryswap.cc;
}
# Health remains loopback-only; no public health location is added.
