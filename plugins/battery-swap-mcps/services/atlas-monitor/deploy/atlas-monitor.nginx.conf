# Reviewed Atlas-only snippet; not included in the live gateway yet.
location = /.well-known/oauth-authorization-server/atlas-monitor {
    proxy_pass http://127.0.0.1:8017/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 64k;
    client_body_timeout 10s;
    access_log off;
    error_log /var/log/nginx/atlas-monitor-error.log crit;
}

location = /.well-known/oauth-protected-resource/atlas-monitor/mcp {
    proxy_pass http://127.0.0.1:8017/.well-known/oauth-protected-resource/atlas-monitor/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 64k;
    client_body_timeout 10s;
    access_log off;
    error_log /var/log/nginx/atlas-monitor-error.log crit;
}

location ^~ /atlas-monitor/ {
    proxy_pass http://127.0.0.1:8017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 64k;
    client_body_timeout 10s;
    access_log off;
    error_log /var/log/nginx/atlas-monitor-error.log crit;
}
